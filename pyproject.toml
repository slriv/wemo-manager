[project]
name = "wemo-manager"
version = "0.1.0"
description = "Web application for managing a collection of WeMo switches via pywemo."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pywemo>=1.2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "ifaddr>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx2>=2.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**", "templates/**"]
